/* Attribution : les points les plus proches du foyer prennent les premières places */
function attribuer({T,A},foyer,pousse){
  const now=performance.now(),cx=foyer?foyer[0]:W/2,cy=foyer?foyer[1]:H/2;
  const besoin=T.length+(mob?140:260);
  while(P.length<besoin)P.push({x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,r:Math.random()*1.2+.4,ph:Math.random()*6.28});
  const cle=foyer?(x,y)=>Math.hypot(x-cx,y-cy):(x,y)=>Math.atan2(y-cy,x-cx);
  const ps=P.map(p=>[cle(p.x,p.y),p]).sort((a,b)=>a[0]-b[0]);
  const ts=T.map((t,k)=>{const q2=posCible(t,now);return[cle(q2[0],q2[1]),k]}).sort((a,b)=>a[0]-b[0]);
  P.forEach(p=>p.t=null);const part=[];
  ts.forEach(([_,k],j)=>{const p=ps[j][1];p.t=T[k];part[k]=p});
  aretes=A.map(([u,v,c,col])=>[part[u],part[v],c,col]);derniere=part;
  if(pousse&&!reduit)P.forEach(p=>{if(!p.t){const dx=p.x-cx,dy=p.y-cy,d=Math.hypot(dx,dy)+1;p.vx+=dx/d*7;p.vy+=dy/d*7}});

function fermerRecit(){recitEl.classList.remove('ouvert');nav.classList.remove('ouvert');ancres=[];document.body.classList.remove('profond');recitEl.onscroll=null}

/* ---------- États ---------- */
function mettre(s){etat=s;document.body.className='e-'+s;document.getElementById('aide').textContent=s==='univers'?AIDE_U:s==='galaxie'&&gal>=0?`Chaque constellation est ${AIDE_G[G[gal].id]} : cliquez pour la lire. Échap pour revenir à l'univers.`:''}
function versUnivers(){
  fermerRecit();gal=-1;act=-1;survol=-1;figure=null;zL.innerHTML='';mettre('univers');
  attribuer(cibleUnivers(),null,false);etiquettes();
}
const scene=document.getElementById('scene'),warpEl=document.getElementById('warp'),raisEl=document.getElementById('rais');
/* Entrer dans une galaxie : on y est aspiré, comme un plongeon vers un nouveau territoire */
function aspirer(x,y,suite){
  if(reduit){suite();return}
  const o=x+'px '+y+'px';
  scene.style.transformOrigin=o;raisEl.style.transformOrigin=o;
  warpEl.style.background=`radial-gradient(circle at ${x}px ${y}px,rgba(236,233,224,1),rgba(${VERM},.6) 30%,rgba(${VERM},0) 60%)`;
  raisEl.style.background=`repeating-conic-gradient(from 0deg at ${x}px ${y}px,rgba(236,233,224,.9) 0deg 1deg,transparent 1deg 7deg)`;
  raisEl.style.webkitMaskImage=raisEl.style.maskImage=`radial-gradient(circle at ${x}px ${y}px,rgba(0,0,0,1) 0%,rgba(0,0,0,.85) 35%,rgba(0,0,0,0) 78%)`;
  scene.classList.add('aspire');warpEl.classList.add('actif');raisEl.classList.add('actif');
  setTimeout(()=>{suite();scene.classList.remove('aspire');scene.style.transformOrigin='';},460);
  setTimeout(()=>{warpEl.classList.remove('actif');raisEl.classList.remove('actif')},680);
}
function versGalaxie(i,depuis){
  fermerRecit();act=-1;survol=-1;figure=null;zL.innerHTML='';
  const foyer=depuis||(lieux[i]&&etat==='univers'?[lieux[i].cx,lieux[i].cy]:[W/2,H/2]);
  gal=i;mettre('galaxie');
  document.getElementById('aNom').textContent=G[i].nom;document.getElementById('aDesc').textContent=nb(G[i].desc);
  attribuer(cibleGalaxie(i),foyer,true);etiquettes();
  pince(FREQ[i*2%FREQ.length],.7);
}
function ouvrir(k,c){
  const foyer=k>=0&&lieux[k]&&etat==='galaxie'?[lieux[k].cx,lieux[k].cy]:k<0&&soleil?[soleil.cx,soleil.cy]:[W/2,H/2];
  act=k;mettre('chapitre');
  attribuer(cibleChapitre(c),foyer,true);figure.part=derniere;legendes();
  document.getElementById('sommaire').classList.remove('ouvert');
  ouvrirRecit(c);
  pince(FREQ[(k+3+FREQ.length)%FREQ.length],.8);
}
function ouvrirSoleil(){gal=-1;document.getElementById('aNom').textContent='Contact';ouvrir(-1,SOL)}
function remonter(){
  if(document.getElementById('sommaire').classList.contains('ouvert')){document.getElementById('sommaire').classList.remove('ouvert');return}
  if(etat==='chapitre'){gal>=0?versGalaxie(gal,figure&&figure.part&&figure.part[0]?[figure.part[0].x,figure.part[0].y]:null):versUnivers()}
  else if(etat==='galaxie')versUnivers();
}

/* ---------- Rendu ---------- */
const images={};
function image(src){if(!images[src]){const im=new Image();im.src=src;images[src]=im}return images[src]}
function boucle(now){
  g.clearRect(0,0,W,H);
  profondQ+=((document.body.classList.contains('profond')?1:0)-profondQ)*.08;
  if(souris.x>-1&&etat!=='chapitre'){const rg=g.createRadialGradient(souris.x,souris.y,0,souris.x,souris.y,220);rg.addColorStop(0,'rgba(203,88,66,.08)');rg.addColorStop(1,'rgba(203,88,66,0)');g.fillStyle=rg;g.fillRect(0,0,W,H)}
  if(etat==='univers'&&soleil){const rg=g.createRadialGradient(soleil.cx,soleil.cy,0,soleil.cx,soleil.cy,soleil.r*2.6);rg.addColorStop(0,`rgba(203,88,66,${survol==='s'?.32:.2})`);rg.addColorStop(1,'rgba(203,88,66,0)');g.fillStyle=rg;g.fillRect(0,0,W,H)}
  const peindre=(i,a)=>{const im=image(i.src);if(!(im.complete&&im.naturalWidth)||a<=0)return;g.save();g.globalAlpha=a;if(i.rond){g.beginPath();g.arc(i.x+i.w/2,i.y+i.h/2,Math.min(i.w,i.h)/2,0,6.283);g.clip()}const r=Math.min(i.w/im.naturalWidth,i.h/im.naturalHeight),w=im.naturalWidth*r,h=im.naturalHeight*r;g.drawImage(im,i.x+(i.w-w)/2,i.y+(i.h-h)/2,w,h);g.restore()};
  if(etat==='galaxie')lieux.forEach((l,k)=>{if(l.img)peindre(l.img,Math.min(1,Math.max(0,(now-l.t0-1400)/900))*(l.img.rond?(survol===k?1:survol===-1?.85:.3):(survol===k?.95:survol===-1?.42:.18)))});
  if(etat==='chapitre'&&figure){figure.trace=Math.min(2,figure.trace+.012);if(figure.img)peindre(figure.img,Math.max(0,Math.min(1,(figure.trace-.7)*1.6))*.95*(1-profondQ))}
  // traits des constellations, tracés peu à peu à l'ouverture ; ils s'effacent quand le récit s'élargit
  if(aretes.length&&(etat==='galaxie'||etat==='chapitre')){
    const n=etat==='chapitre'?Math.floor(aretes.length*Math.max(0,Math.min(1,figure?figure.trace:1))):aretes.length;
    for(let k=0;k<n;k++){const[a,b,c,col]=aretes[k];if(!a||!b)continue;const vif=etat==='galaxie'&&survol===c,terne=etat==='galaxie'&&survol>=0&&!vif;
      const rouge=col==='v'||vif,baseA=terne?.1:vif?.75:rouge?.6:etat==='galaxie'?.42:.3,aLigne=etat==='chapitre'?baseA*(1-profondQ):baseA;
      g.lineWidth=etat==='chapitre'?(rouge?1.1:.8):.8;
      g.strokeStyle=`rgba(${rouge?VERM:PAPIER},${aLigne})`;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}
  }
  // fils de lumière entre chaque ligne du récit et son étoile
  if(etat==='chapitre'&&figure&&figure.part&&!mob&&figure.trace>1&&ancres.length&&figure.an.length){
    const rc=recitEl.getBoundingClientRect(),fade=Math.min(1,(figure.trace-1)*2)*(1-profondQ);
    ancres.forEach(el=>{const i=+el.dataset.a,p=figure.part[figure.an[i%figure.an.length]];if(!p)return;const r=el.getBoundingClientRect();
      if(r.bottom<rc.top+24||r.top>rc.bottom-40)return;const x2=r.left+3,y2=r.top+(el.tagName==='DT'?13:12),vif=figure.hl===i;
      g.strokeStyle=`rgba(${vif?VERM:PAPIER},${(vif?.65:.09)*fade})`;g.lineWidth=vif?1:.6;g.beginPath();g.moveTo(p.x,p.y);
      g.bezierCurveTo(p.x+(x2-p.x)*.5,p.y,p.x+(x2-p.x)*.5,y2,x2,y2);g.stroke()});
  }
  const hlP=etat==='chapitre'&&figure&&figure.part&&figure.hl>=0?figure.part[figure.an[figure.hl%figure.an.length]]:null;
  for(const p of P){
    const t=p.t;let col=PAPIER,a=1,r=p.r,halo=0;
    if(t){const[tx,ty]=posCible(t,now);p.vx=p.vx*.8+(tx-p.x)*.017;p.vy=p.vy*.8+(ty-p.y)*.017;
      if(t.orb){const vif=survol===t.g;
        if(t.v==='v'){col=VERM;r=1.9;halo=.25}else if(t.v==='c'){r=1.7;a=.95;halo=.12;if(vif)col=VERM}else{r=1.1;a=vif?.95:.55;if(vif)col=VERM}}
      else{const vif=etat==='galaxie'&&survol===t.c,terne=etat==='galaxie'&&survol>=0&&!vif,s=t.big?1:(t.sc||.8),pt=!t.big;
        if(t.v==='v'){col=VERM;r=2.2*s;halo=.22}
        else if(t.v==='b'){r=2.3*s;halo=pt?.06:.2}
        else if(t.v==='f'){r=1.05*s;a=.6}
        else if(t.v==='sync'){col=VERM;r=1.9*s;a=.25+.75*Math.max(0,Math.sin(now*.0035-t.ph*1.1));halo=.25*a}
        else{r=1.6*s;halo=pt?0:.08}
        a*=.85+.15*Math.sin(now*.003+p.ph);
        if(vif){r*=1.25;halo+=.15}if(terne)a*=.45
        if(!pt){a*=(1-profondQ);halo*=(1-profondQ)}}
      if(p===hlP){r*=2;halo=.55;col=VERM}}
    else{const dx=p.x-souris.x,dy=p.y-souris.y,d2=dx*dx+dy*dy;
      if(d2<16000){const f=(16000-d2)/16000*.35;p.vx+=dx/Math.sqrt(d2+1)*f;p.vy+=dy/Math.sqrt(d2+1)*f}
      p.vx=p.vx*.985+(Math.random()-.5)*.05;p.vy=p.vy*.985+(Math.random()-.5)*.05;
      if(etat!=='chaos'){p.vx*=.97;p.vy*=.97}
      if(p.x<0)p.x+=W;if(p.x>W)p.x-=W;if(p.y<0)p.y+=H;if(p.y>H)p.y-=H;
      a=(etat==='chaos'?.55:.16)*(.55+.45*Math.sin(now*.002+p.ph))}
    p.x+=p.vx;p.y+=p.vy;
    if(halo){g.beginPath();g.fillStyle=`rgba(${col},${halo*a})`;g.arc(p.x,p.y,r*3.6,0,6.283);g.fill()}
    g.beginPath();g.fillStyle=`rgba(${col},${a})`;g.arc(p.x,p.y,r,0,6.283);g.fill();
  }
  requestAnimationFrame(boucle);
}

/* ---------- Gestes ---------- */
function sous(x,y){
  if(etat==='univers'){if(soleil&&Math.hypot(x-soleil.cx,y-soleil.cy)<soleil.r*1.2)return's';
    let b=-1,bd=1e9;lieux.forEach((l,i)=>{const d=Math.hypot(x-l.cx,y-l.cy);if(d<l.r*1.25&&d<bd){bd=d;b=i}});return b}
  if(etat==='galaxie')return lieux.findIndex(l=>x>=l.x&&x<=l.x+l.w&&y>=l.y&&y<=l.y+l.h);
  return -1;
}
function marquer(s){
  if(s===survol)return;survol=s;cv.style.cursor=(s===-1)?(etat==='chapitre'?'zoom-out':'default'):'pointer';
  lieux.forEach((l,i)=>{if(l.el){l.el.classList.toggle('vive',i===s);l.el.classList.toggle('terne',s!==-1&&i!==s)}});
  if(soleil&&soleil.el&&etat==='univers'){soleil.el.classList.toggle('vive',s==='s');soleil.el.classList.toggle('terne',s!==-1&&s!=='s')}
  if(s!==-1)pince(s==='s'?293.66:FREQ[(etat==='univers'?s*2:s+3)%FREQ.length],.4);
}
cv.addEventListener('pointermove',e=>{souris={x:e.clientX,y:e.clientY};marquer(sous(e.clientX,e.clientY))});
cv.addEventListener('pointerleave',()=>{souris={x:-999,y:-999};marquer(-1)});
cv.addEventListener('click',e=>{
  if(etat==='chaos'){versUnivers();return}
  if(etat==='chapitre'){remonter();return}
  const s=sous(e.clientX,e.clientY);
  if(etat==='univers'){if(s==='s')ouvrirSoleil();else if(s>=0){const x=lieux[s].cx,y=lieux[s].cy;aspirer(x,y,()=>versGalaxie(s,[x,y]))}}
  else if(etat==='galaxie'){if(s>=0)ouvrir(s,G[gal].items[s]);else versUnivers()}
});
addEventListener('wheel',e=>{if(etat==='chaos'&&e.deltaY>0)versUnivers()},{passive:true});
let ty0=null;addEventListener('touchstart',e=>ty0=e.touches[0].clientY,{passive:true});
addEventListener('touchmove',e=>{if(etat==='chaos'&&ty0!==null&&ty0-e.touches[0].clientY>40)versUnivers()},{passive:true});
document.getElementById('ordonner').onclick=e=>{e.stopPropagation();versUnivers()};
document.getElementById('retour').onclick=()=>versUnivers();
document.getElementById('fermer').onclick=remonter;
document.getElementById('lb').onclick=()=>document.getElementById('lb').classList.remove('ouvert');
const pas=d=>{if(gal<0)return;const n=G[gal].items.length,k=(act+d+n)%n;ouvrir(k,G[gal].items[k])};
document.getElementById('prec').onclick=()=>pas(-1);
document.getElementById('suiv').onclick=()=>pas(1);
const bS=document.getElementById('son');bS.onclick=()=>{son=!son;bS.setAttribute('aria-pressed',son);if(son)pince(293.66,.6)};
addEventListener('keydown',e=>{
  if(e.key==='Escape'){const lb=document.getElementById('lb');if(lb.classList.contains('ouvert')){lb.classList.remove('ouvert');return}remonter()}
  if(etat==='chapitre'&&e.key==='ArrowRight')pas(1);
  if(etat==='chapitre'&&e.key==='ArrowLeft')pas(-1);
  if(etat==='chaos'&&(e.key==='ArrowDown'||e.key===' '||e.key==='Enter')){e.preventDefault();versUnivers()}
});
const som=document.getElementById('sommaire');
som.innerHTML=`<section><h3><button data-s="1">Contact</button></h3><ol><li><button data-s="1">${SOL.court}<i>${SOL.chiffre}</i></button></li></ol></section>`+
  G.map((ga,i)=>`<section><h3><button data-g="${i}">${ga.nom}</button></h3><ol>${ga.items.map((c,k)=>`<li><button data-g="${i}" data-k="${k}">${nb(c.titre)}<i>${nb(c.chiffre)}</i></button></li>`).join('')}</ol></section>`).join('');
som.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;som.classList.remove('ouvert');if(etat==='chaos')versUnivers();
  if(b.dataset.s){ouvrirSoleil();return}
  const i=+b.dataset.g;versGalaxie(i);if(b.dataset.k!==undefined)ouvrir(+b.dataset.k,G[i].items[+b.dataset.k])});
document.getElementById('voirListe').onclick=()=>som.classList.toggle('ouvert');

/* ---------- Mise en route ---------- */
function taille(){
  const dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;mob=W<700;
  cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);
  if(!P.length)for(let k=0;k<(mob?600:900);k++)P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.6,vy:(Math.random()-.5)*.6,r:Math.random()*1.2+.4,ph:Math.random()*6.28});
  if(etat==='univers')versUnivers();
  else if(etat==='galaxie')versGalaxie(gal,[W/2,H/2]);
  else if(etat==='chapitre'){const k=act,i=gal;if(i>=0){versGalaxie(i,[W/2,H/2]);ouvrir(k,G[i].items[k])}else{versUnivers();ouvrirSoleil()}}
}
taille();
/* Liens profonds : marketing.html#experience ouvre directement la galaxie */
{const H2={experience:0,extracurricular:1,volunteer:2,portfolio:3,education:4,skills:5},h=location.hash.slice(1);
 if(h==='contact'||h==='about'){versUnivers();if(h==='contact')ouvrirSoleil()}else if(h in H2){versUnivers();versGalaxie(H2[h],[W/2,H/2])}}
addEventListener('resize',()=>{clearTimeout(window._r);window._r=setTimeout(taille,200)});
requestAnimationFrame(boucle);
})();
</script>
